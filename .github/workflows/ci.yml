name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Tests de logique métier PURS (aucun navigateur, aucune DB) — le cœur
      # financier (décompte carnet, résolution, prefs de notif) est BLOQUANT.
      # Les specs navigateur (démo + DB réelle) restent en local :
      # `npx playwright test --workers=1`.
      - name: Tests métier (Node pur)
        run: npx playwright test tests/e2e/pointage-delta.spec.js tests/e2e/carnet-resolution.spec.js tests/e2e/notif-prefs.spec.js tests/e2e/regles-annulation.spec.js tests/e2e/recurrence-capacite.spec.js tests/e2e/route-standards.spec.js tests/e2e/plan-guard.spec.js --reporter=line
        env:
          # Ces specs n'ouvrent NI navigateur NI serveur — mais sans cette
          # variable, playwright.config lance son webServer (npm run dev),
          # qui ne peut pas monter en CI (pas de .env.local) → tout rouge.
          # Vérifié localement : 67/67 en 2s avec browsers path vide.
          E2E_BASE_URL: http://unused.invalid

      # BLOQUANT depuis B0b (campagne 2026-07-25) : 0 erreur ESLint tolérée.
      # Ratchet warnings (B2d, recalé 2026-07-26 après jsx-uses-vars : 1033
      # warnings dont ~940 fantômes « unused » sur des identifiants JSX →
      # 122 VRAIS restants). Un warning DE PLUS casse la CI ; en dessous,
      # ABAISSER le plafond ici. Vérif locale AVANT push : `npm run lint`
      # global — jamais --quiet, qui masque les warnings.
      - name: Lint
        run: npm run lint --if-present -- --max-warnings=122

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          NEXT_PUBLIC_APP_URL: https://www.izisolo.fr
          ANTHROPIC_API_KEY: dummy
          RESEND_API_KEY: dummy
          STRIPE_SECRET_KEY: dummy
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: dummy
          STRIPE_WEBHOOK_SECRET: dummy
          CRON_SECRET: dummy
